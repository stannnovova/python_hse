[project]
name = "password-manager"
version = "0.1.0"
description = "Console password manager"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint]
extend-select = [
    "D",    # docstring
    "ANN",  # аннотации
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
